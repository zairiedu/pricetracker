name: Validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node --check cloud.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test reusable product extractor
        run: deno test supabase/functions/pricepilot-preview/parser.test.ts supabase/functions/pricepilot-preview/url-policy.test.ts
